name: Build MobiladorID AML

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native libraries
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for ABI in armeabi-v7a arm64-v8a; do
            cmake -S . -B "build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$ABI" -j
          done

      - name: Package
        run: |
          mkdir -p dist/armeabi-v7a dist/arm64-v8a
          cp build/armeabi-v7a/libMobiladorID.so dist/armeabi-v7a/
          cp build/arm64-v8a/libMobiladorID.so dist/arm64-v8a/
          cat > dist/README.txt <<'TXT'
          MobiladorID AML

          Place the matching ABI libMobiladorID.so in the AML mods directory.
          The mod does not replace libSAMP/libNezukoSA-MP and installs no input hooks.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: MobiladorID_AML
          path: dist

      - name: Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/armeabi-v7a/libMobiladorID.so
            dist/arm64-v8a/libMobiladorID.so
